name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Statische Website vorbereiten
        run: |
          mkdir -p _site
          cp index.html package.json _site/
          cp -R assets data _site/

      - name: Buildinformationen erzeugen
        run: >-
          node scripts/generate-build-info.mjs
          --build-number "${GITHUB_RUN_NUMBER}"
          --output "_site/data/build-info.json"

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
